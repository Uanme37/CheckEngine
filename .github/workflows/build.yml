name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - run: chmod +x gradlew
      - run: ./gradlew build
      - uses: actions/upload-artifact@v7
        with:
          name: packdoctor-jars
          path: |
            mod/build/libs/*.jar
            cli/build/libs/*.jar