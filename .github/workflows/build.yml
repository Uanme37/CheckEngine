name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - run: chmod +x gradlew
      - run: ./gradlew build
      # One download with everything a player needs: both mods (NeoForge 1.21.1, Forge 1.20.1), the standalone checker and its launcher.
      - name: Collect files
        run: |
          mkdir dist
          cp mod/build/libs/*.jar forge-mod/build/libs/*.jar cli/build/libs/*.jar "Check Pack.bat" dist/
      - uses: actions/upload-artifact@v7
        with:
          name: packdoctor
          path: dist/