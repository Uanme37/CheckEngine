// The Forge 1.20.1 mod: same features as mod/ (NeoForge 1.21.1), for Forge packs. Java 17.
plugins {
    id 'java-library'
    id 'net.neoforged.moddev.legacyforge'
}

// Packed inside the early plugin jar (early-forge/), which is what players install.
base { archivesName = "${mod_id}-forge-1.20.1-mod" }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

legacyForge {
    version = project.forge_version

    parchment {
        mappingsVersion = project.forge_parchment_mappings_version
        minecraftVersion = project.forge_parchment_minecraft_version
    }

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    implementation project(':core')
    additionalRuntimeClasspath project(':core')
    // Real installs get core from the early plugin jar it's packed in, so it's not bundled here.
    // Dev runs only: load real (obfuscated) mod jars from a folder, e.g. -PtestMods=C:/some/folder
    if (project.hasProperty('testMods')) {
        repositories { flatDir { dirs project.property('testMods') } }
        file(project.property('testMods')).listFiles().findAll { it.name.endsWith('.jar') }.each {
            modRuntimeOnly "local:${it.name - '.jar'}:"
        }
    }
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version_range: forge_minecraft_version_range,
            loader_version_range   : forge_loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
legacyForge.ideSyncTask generateModMetadata
