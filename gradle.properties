org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Minecraft / NeoForge
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.252
# Oldest NeoForge the mod accepts (it only builds against neo_version). FTB Skies 2 ships 21.1.250.
neo_version_range=[21.1.0,)
# NeoForge 21.1.x's mod loader, for the early plugin (early/)
fml_version=4.0.44
# NeoForge 26.1.2's mod loader, for early-26/
fml26_version=11.0.15
loader_version_range=[1,)
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# Forge 1.20.1 build (forge-mod/)
forge_version=1.20.1-47.4.0
forge_minecraft_version_range=[1.20.1,1.20.2)
forge_loader_version_range=[47,)
forge_parchment_minecraft_version=1.20.1
forge_parchment_mappings_version=2023.09.03

# Mod
mod_id=checkengine
mod_name=Check Engine
mod_license=MIT
mod_version=0.7.0
mod_group_id=com.guiltypotato.checkengine

# NeoForge 26.1 build (mod-26/), Java 25
mc26_version=26.1
mc26_version_range=[26.1.2,26.2)
neo26_version=26.1.2.114
neo26_version_range=[26.1.2,)
