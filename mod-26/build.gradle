// The NeoForge 26.1 mod: same features as mod/ (1.21.1), built for Minecraft 26.1.x on Java 25.
plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev'
}

// Packed inside the early plugin jar (early-26/), which is what players install.
base { archivesName = "${mod_id}-neoforge-${mc26_version}-mod" }

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = project.neo26_version

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
        configureEach {
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation project(':core')
    // Real installs get core from the early plugin jar it's packed in, so it's not bundled here.
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version_range: mc26_version_range,
            neo_version_range      : neo26_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata
