pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.neoforged.net/releases' }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'CheckEngine'
include 'core', 'cli', 'mod', 'early', 'forge-mod', 'mod-26', 'early-26', 'early-forge'
// Dev games, only on the PC that has them
['early-test', 'early-test-26', 'early-test-forge'].each { if (file("$it/build.gradle").exists()) include it }
